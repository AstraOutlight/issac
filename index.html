<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Binding of Isaac</title>
<style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}#game{width:100vw;height:100dvh;display:block}ruffle-player{width:100%;height:100%;display:block}#error{display:none;position:fixed;inset:0;place-items:center;color:white;background:#000;font:16px sans-serif;text-align:center;padding:24px}</style>
<script>window.RufflePlayer=window.RufflePlayer||{};window.RufflePlayer.config={publicPath:'./ruffle/',autoplay:'on',unmuteOverlay:'hidden',letterbox:'on',warnOnUnsupportedContent:false,showSwfDownload:false,contextMenu:'off',splashScreen:false};</script>
<script src="./ruffle/ruffle.js" defer></script></head><body><div id="game"></div><div id="error"></div>
<script>window.addEventListener('DOMContentLoaded',async()=>{try{if(!window.RufflePlayer)throw Error('Ruffle is missing. Run the setup workflow first.');const player=window.RufflePlayer.newest().createPlayer();document.getElementById('game').append(player);await player.load({url:'./isaac.swf',backgroundColor:'#000000',autoplay:'on',unmuteOverlay:'hidden',letterbox:'on'});}catch(e){const el=document.getElementById('error');el.textContent='Game could not start: '+e.message;el.style.display='grid';console.error(e)}});</script></body></html>
