name: Bundle Ruffle locally
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ruffle.yml'
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official self-hosted Ruffle release
        run: |
          python3 - <<'PYCODE'
          import json, urllib.request, zipfile, io, pathlib
          req=urllib.request.Request('https://api.github.com/repos/ruffle-rs/ruffle/releases/latest',headers={'User-Agent':'isaac-github-pages'})
          with urllib.request.urlopen(req) as r: release=json.load(r)
          assets=release['assets']
          matches=[a for a in assets if 'web-selfhosted' in a['name'] and a['name'].endswith('.zip')]
          if not matches: raise RuntimeError('No official web-selfhosted ZIP in latest Ruffle release')
          req=urllib.request.Request(matches[0]['browser_download_url'],headers={'User-Agent':'isaac-github-pages'})
          with urllib.request.urlopen(req) as r: data=r.read()
          root=pathlib.Path('ruffle');root.mkdir(exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
            for entry in z.infolist():
              if entry.is_dir(): continue
              path=pathlib.PurePosixPath(entry.filename)
              if '..' in path.parts: raise RuntimeError('Unsafe ZIP entry')
              target=root.joinpath(*path.parts)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(z.read(entry))
          if not (root/'ruffle.js').exists():
            matches=list(root.rglob('ruffle.js'))
            if len(matches)!=1: raise RuntimeError('Cannot locate ruffle.js')
            nested=matches[0].parent
            for f in nested.iterdir():
              if f.is_file(): (root/f.name).write_bytes(f.read_bytes())
          print('Ruffle bundled')
          PYCODE
      - name: Commit Ruffle assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ruffle
          if ! git diff --cached --quiet; then git commit -m "Bundle self-hosted Ruffle" && git push; fi
